<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vonk — Werfplannen</title>
<style>
  :root{ --bg:#0b1220; --card:#151f2e; --line:rgba(255,255,255,0.1); --tekst:#e2e8f0; --grijs:#94a3b8; --accent:#00e5a0; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--tekst); font-family:'DM Sans',-apple-system,Segoe UI,Roboto,sans-serif; }
  header{ padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  header .logo{ width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#00e5a0,#0891b2);display:flex;align-items:center;justify-content:center;font-weight:800;color:#04121f; }
  header h1{ font-size:18px; margin:0; font-weight:700; }
  header .sub{ font-size:12px; color:var(--grijs); margin-top:2px; }
  .wrap{ max-width:900px; margin:0 auto; padding:24px; }
  .zoek{ width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--tekst); font-size:14px; margin-bottom:20px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  a.kaart{ display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; transition:border-color .15s, transform .1s; }
  a.kaart:hover{ border-color:var(--accent); transform:translateY(-2px); }
  a.kaart .titel{ font-size:15px; font-weight:700; margin-bottom:6px; }
  a.kaart .datum{ font-size:12px; color:var(--grijs); }
  a.kaart .pijl{ margin-top:12px; font-size:12px; color:var(--accent); }
  .leeg,.laden{ text-align:center; color:var(--grijs); padding:60px 20px; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="logo">V</div>
  <div>
    <h1>Vonk — Werfplannen</h1>
    <div class="sub">Overzicht van gepubliceerde plannen</div>
  </div>
</header>
<div class="wrap">
  <input id="zoek" class="zoek" placeholder="Zoek een plan…" oninput="filter()">
  <div id="lijst" class="grid"></div>
  <div id="status" class="laden">Plannen laden…</div>
</div>
<script>
let ALLE = [];
function fmtDatum(iso){
  try{ const d=new Date(iso); return d.toLocaleDateString('nl-BE',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function toon(items){
  const l=document.getElementById('lijst');
  l.innerHTML = items.map(function(p){
    return '<a class="kaart" href="plannen/'+encodeURIComponent(p.bestand)+'">'
      + '<div class="titel">'+escapeHtml(p.titel||p.bestand)+'</div>'
      + '<div class="datum">'+fmtDatum(p.datum)+'</div>'
      + '<div class="pijl">Open plan →</div></a>';
  }).join('');
  document.getElementById('status').style.display = items.length ? 'none' : 'block';
  if(!items.length){ document.getElementById('status').className='leeg'; document.getElementById('status').textContent='Nog geen plannen gepubliceerd.'; }
}
function filter(){
  const q=document.getElementById('zoek').value.toLowerCase();
  toon(ALLE.filter(function(p){ return (p.titel||p.bestand||'').toLowerCase().indexOf(q)>=0; }));
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
// Lijst live inladen (met cache-buster zodat je altijd de verse lijst ziet).
fetch('plannen.json?t='+Date.now())
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(function(data){ ALLE = Array.isArray(data)?data:[]; toon(ALLE); })
  .catch(function(){ document.getElementById('status').className='leeg'; document.getElementById('status').textContent='Nog geen plannen gepubliceerd.'; });
</script>
